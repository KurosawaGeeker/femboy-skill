name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  community-content:
    name: Community content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate case metadata and index
        run: python3 scripts/validate_cases.py
      - name: Validate consumer metadata and index
        run: python3 scripts/validate_consumer.py
