name: 功能或主题建议
description: 建议新的主题、资料整理、来源或社区改进
title: "feat(scope): "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 用户需求
      description: 这个建议要帮助用户解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 参考来源
      description: 资料整理请标明截图、原文或社区来源；新增医学结论或诊疗建议再提供相关权威来源。
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 建议不包含未成年人露骨内容、危险 DIY 医疗或未经同意的实践。
          required: true
